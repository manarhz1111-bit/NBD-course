---
- name: Load the search API and Qdrant step by step
  ansible.builtin.command:
    cmd: "{{ search_python }} -m shopsearch loadtest --duration {{ loadtest_duration }} --levels {{ loadtest_levels }}"
    chdir: "{{ search_home }}/app"
  become: true
  become_user: "{{ search_user }}"
  environment: "{{ search_env | combine({'QDRANT_API_KEY': qdrant_read_key, 'HF_HUB_OFFLINE': '1', 'SEARCH_URL': search_url}) }}"
  register: search_run
  changed_when: false

- name: Report the load test
  ansible.builtin.debug:
    msg: "{{ search_run.stdout_lines }}"
