---
- name: Write the Qdrant configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ qdrant_config }}"
    owner: root
    group: "{{ qdrant_user }}"
    mode: "0640"
  no_log: true
  notify: Restart Qdrant

- name: Install the Qdrant systemd unit
  ansible.builtin.template:
    src: qdrant.service.j2
    dest: /etc/systemd/system/qdrant.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Qdrant

- name: Enable and start Qdrant
  ansible.builtin.systemd_service:
    name: qdrant
    enabled: true
    state: started
    daemon_reload: true

- name: Apply Qdrant changes now
  ansible.builtin.meta: flush_handlers

- name: Wait until all Qdrant shards are ready
  ansible.builtin.uri:
    url: "{{ qdrant_url }}/readyz"
    return_content: true
  register: qdrant_ready
  until: qdrant_ready.status == 200
  retries: 30
  delay: 2
