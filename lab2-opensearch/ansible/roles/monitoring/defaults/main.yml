---
# Prometheus exporter plugin settings (dynamic cluster settings).
# Index-level metrics only for the log backing indices: they are what the
# lab is about, and it keeps the number of time series small.
prometheus_plugin_settings:
  prometheus.indices: true
  prometheus.indices_filter.selected_indices: ".ds-{{ logs_data_stream }}-*"
  prometheus.indices_filter.selected_option: "STRICT_EXPAND_OPEN_HIDDEN_FORBID_CLOSED"
  prometheus.cluster.settings: true
  prometheus.nodes.filter: "_local"

# Same versions and checksums as in lab 1 (already verified there)
prometheus_version: "3.15.0"
prometheus_sha256: "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0"
prometheus_port: 9090
prometheus_scrape_interval: "15s"

grafana_version: "13.2.3"
grafana_build: "36482603486"
grafana_sha256: "55ec511999f9c56f3c26b633d0dc31b750c77a682a5ef379edf0d3fe634a7a2f"
grafana_port: 3000
