---
mongodb_major_version: "9.0"
mongodb_apt_distribution: "jammy"

mongodb_port: 27017
mongodb_bind_ip: "127.0.0.1"

mongodb_db_path: "/var/lib/mongodb"
mongodb_log_path: "/var/log/mongodb/mongod.log"

mongodb_admin_user: "lab1AnsibleAdmin"
mongodb_admin_marker_path: "{{ mongodb_db_path }}/.lab1_ansible_admin_created"
mongodb_authorization_enabled: true

mongodb_training_db: "lab1_university_ansible"
mongodb_library_db: "lab1_library_ansible"
